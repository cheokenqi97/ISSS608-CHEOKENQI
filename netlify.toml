[build]
  publish = "_site"
  command = """
    set -e
    mkdir -p $HOME/quarto
    curl -L -o quarto.tgz https://github.com/quarto-dev/quarto-cli/releases/latest/download/quarto-linux-amd64.tar.gz
    tar -xzf quarto.tgz -C $HOME/quarto --strip-components=1
    export PATH="$HOME/quarto/bin:$PATH"
    quarto --version
    quarto render
  """